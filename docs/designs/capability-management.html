<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerDSH · 技能与 MCP 设计草稿</title>
<style>
:root{color-scheme:dark;--base:#1c1e21;--side:#24262a;--layer:#27292d;--line:#37393e;--text:#eeeef0;--muted:#969aa4;--dim:#737985;--hover:#303237;--active:#36383e;--fill:#ededf0;--ink:#1c1e21;--ring:#81b4e6;--off:#51545c;--error:#df9292}
:root[data-theme=light]{color-scheme:light;--base:#fff;--side:#f5f6f8;--layer:#f5f6f8;--line:#e2e4e8;--text:#25272d;--muted:#777d87;--dim:#9197a1;--hover:#eceef2;--active:#e8eaef;--fill:#26282e;--ink:#fff;--ring:#376fb6;--off:#c2c6ce;--error:#ae4545}
*{box-sizing:border-box}body{margin:0;background:var(--side);color:var(--text);font:14px/22px Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.4}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ring);outline-offset:2px}button:disabled:hover{background:inherit}.preview-bar{max-width:1096px;margin:28px auto 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;font-size:12px;color:var(--muted)}.preview-bar strong{font-weight:500;color:var(--text)}.preview-bar button{background:transparent;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:12px}.shell{max-width:1096px;min-height:690px;margin:0 auto 30px;display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--base);border:1px solid var(--line);border-radius:16px;overflow:hidden}.sidebar{background:var(--side);padding:22px 12px;display:flex;flex-direction:column;gap:4px;border-right:.5px solid var(--line)}.sidebar h1{font-size:15px;line-height:22px;font-weight:500;margin:2px 12px 24px}.nav-item{border:0;background:transparent;display:flex;align-items:center;gap:10px;text-align:left;min-height:36px;padding:7px 12px;border-radius:8px;width:100%;font-size:14px}.nav-item[hidden]{display:none}.nav-item svg{width:16px;height:16px;flex:none}.nav-item:hover{background:var(--hover)}.nav-item[aria-current=page]{background:var(--active);font-weight:500}.context-link{padding:6px 12px;color:var(--muted)}.nav-divider{height:1px;background:var(--line);margin:12px}.side-foot{margin-top:auto;padding:20px 12px 0;font-size:12px;color:var(--muted)}main{min-width:0;padding:32px 36px}.heading{display:flex;flex-direction:column;gap:12px}h2{font-size:16px;line-height:24px;font-weight:500;margin:0}.description{margin:0;font-size:14px;line-height:22px;color:var(--muted)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 12px}.filters{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}.filters select{background:transparent;border:0;border-radius:6px;padding:4px 6px;max-width:132px;font-size:13px}.search{display:flex;gap:6px;align-items:center;border:.5px solid var(--line);border-radius:12px;height:32px;padding:0 8px;background:var(--layer);width:216px}.search:focus-within{border-color:var(--ring)}.search svg{width:16px;height:16px;color:var(--muted);flex:none}.search input{border:0;outline:none;background:transparent;min-width:0;width:100%;font-size:14px;line-height:22px}.search input:focus-visible{outline:none}.search input::placeholder{color:var(--dim)}.list{list-style:none;padding:0;margin:0}.row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;column-gap:12px;align-items:center;padding:20px 0;border-bottom:.5px solid var(--line)}.row:first-child{border-top:.5px solid var(--line)}.row-icon{align-self:start;padding-top:2px;color:var(--muted)}.row-icon svg{width:20px;height:20px;display:block}.name-line{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}.item-name{font-size:14px;line-height:22px;font-weight:500;margin:0}.source{font-size:11px;line-height:18px;color:var(--muted);background:var(--layer);padding:0 6px;border-radius:4px}.sub{font-size:13px;line-height:20px;color:var(--muted);margin:4px 0 0;overflow-wrap:anywhere}.item-meta{font-size:12px;line-height:18px;color:var(--dim);margin:4px 0 0}.controls{display:flex;align-items:center;gap:12px;margin-left:12px}.readonly{font-size:12px;color:var(--dim)}.switch{box-sizing:content-box;position:relative;flex:none;width:32px;height:16px;padding:2px;border:0;border-radius:999px;background:var(--off);display:block}.switch[aria-checked=true]{background:var(--fill)}.thumb{display:block;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .12s}.switch[aria-checked=true] .thumb{transform:translateX(16px);background:var(--ink)}.switch:disabled{opacity:.4}.switch:not(:disabled):hover{filter:brightness(1.08)}.switch:disabled:hover{background:var(--off)}.switch:disabled[aria-checked=true]:hover{background:var(--fill)}.empty{padding:90px 0;text-align:center;color:var(--muted)}.detail-note{font-size:12px;color:var(--muted);margin:22px 0 0;display:none}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 0;border-bottom:.5px solid var(--line)}.settings-row h3{font-size:14px;font-weight:400;margin:0}.settings-row p{font-size:13px;line-height:20px;color:var(--muted);margin:4px 0 0}.proposal{max-width:1096px;margin:0 auto 30px;padding:0 12px;color:var(--muted);font-size:12px}.proposal p{margin:6px 0}.proposal strong{font-weight:500;color:var(--text)}.status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:760px){.shell{margin:0 12px 20px;grid-template-columns:150px minmax(0,1fr)}main{padding:24px 20px}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.readonly{display:none}.controls{margin-left:0}.row{column-gap:8px}.sidebar{padding:20px 8px}.preview-bar{margin-top:16px}}@media(max-width:480px){.shell{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:.5px solid var(--line);flex-direction:row;flex-wrap:wrap;padding:12px}.sidebar h1,.side-foot,.context-link,.nav-divider{display:none}.nav-item{width:auto}.preview-bar{flex-wrap:wrap}main{padding:24px 18px}.filters{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){.thumb{transition:none}}
</style>
</head>
<body>
<div class="preview-bar"><span><strong>PowerDSH · 设置页设计草稿</strong>　示例数据，不会更改 DSH 配置</span><button type="button" id="theme">切换浅色</button></div>
<div class="shell">
<nav class="sidebar" aria-label="设置导航"><h1>设置</h1><div class="context-link">通用</div><div class="context-link">模型</div><div class="context-link">插件</div><div class="nav-divider"></div><button type="button" class="nav-item" data-page="mod"></button><div class="context-link">个性化</div><button type="button" class="nav-item" data-page="skills" aria-current="page"></button><button type="button" class="nav-item" data-page="mcp"></button><div class="side-foot">沿用原生设置侧栏</div></nav>
<main id="main"></main>
</div>
<div class="proposal"><p><strong>草稿范围：</strong>独立的「技能」「MCP」设置页；名称、简介、来源、单项开关；搜索和来源筛选。可点击左侧切换页面、模拟开关、搜索或切换主题。</p><p><strong>启停语义：</strong>技能按来源分别影响个人或项目文件；插件内置项只读。MCP 开关作用于当前配置，可影响该配置下的全部会话，不把启用状态当作连接状态。实际能否操作以后端能力为准。</p><p><strong>历史草稿：</strong>现行 MCP 管理仅有全局列表，不提供项目范围。此处保留早期交互研究；当前行为以 MCP 管理文档为准，本稿不代表运行时页面已验收。</p></div>
<div class="status" role="status" id="status"></div>
<script>
'use strict';
const paths={skill:'<path d="M4 4h5a3 3 0 0 1 3 3v13a4 4 0 0 0-4-2H4V4Z"/><path d="M20 4h-5a3 3 0 0 0-3 3v13a4 4 0 0 1 4-2h4V4Z"/>',mcp:'<path d="m9 3 5 5-6 6-5-5 6-6Zm6 7 6 6-5 5-6-6M12 11l-2 2m5 1-2 2"/>',settings:'<path d="M4 7h16M4 17h16M8 4v6m8 4v6"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>'};
function icon(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+paths[name]+'</svg>'}
const labels={mod:'PowerDSH',skills:'技能',mcp:'MCP'};
const model={page:'skills',query:'',filter:'all',features:{skills:true,mcp:true},skills:[{id:'skill-review',name:'code-review',description:'检查代码改动，关注正确性、边界情况和回归风险。',source:'个人',kind:'personal',enabled:true},{id:'skill-ui',name:'ui-guidelines',description:'按项目约定处理页面布局、文案和交互。',source:'项目',kind:'project',enabled:true},{id:'skill-release',name:'release-notes',description:'根据版本改动整理简洁、清晰的更新说明。',source:'个人',kind:'personal',enabled:false},{id:'skill-office',name:'office',description:'创建、编辑和检查文档、表格与演示文稿。',source:'插件',kind:'plugin',enabled:true,readonly:true,reason:'由提供方管理，当前不支持单独启停'}],mcp:[{id:'mcp-browser',name:'browser',description:'浏览网页并执行浏览器自动化操作。',source:'当前配置',kind:'profile',meta:'HTTP',enabled:true},{id:'mcp-files',name:'filesystem',description:'访问已授权目录中的文件。',source:'当前配置',kind:'profile',meta:'Stdio',enabled:true},{id:'mcp-repo',name:'repository',description:'查询仓库信息与开发任务。',source:'当前配置',kind:'profile',meta:'HTTP',enabled:false},{id:'mcp-preset',name:'preset-tools',description:'由当前模式提供的 MCP 能力。',source:'模式提供',kind:'preset',meta:'',enabled:true,readonly:true,reason:'由模式管理，当前不支持单独启停'}]};
const main=document.getElementById('main');
function element(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el}
function toggle(id,enabled,disabled,onToggle,label){const button=element('button','switch');button.type='button';button.id=id;button.setAttribute('role','switch');button.setAttribute('aria-checked',String(enabled));button.setAttribute('aria-label',label);button.disabled=Boolean(disabled);button.append(element('span','thumb'));button.addEventListener('click',()=>{onToggle(!enabled)});return button}
function header(title,description){const el=element('header','heading');el.append(element('h2','',title),element('p','description',description));main.append(el)}
function renderNav(){document.querySelectorAll('[data-page]').forEach(button=>{const page=button.dataset.page;button.innerHTML=icon(page==='mod'?'settings':page==='skills'?'skill':'mcp');button.append(document.createTextNode(labels[page]));if(page===model.page)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');button.hidden=page!=='mod'&&!model.features[page]})}
function renderList(){const list=document.getElementById('list');list.replaceChildren();const entries=model[model.page].filter(row=>(model.filter==='all'||row.kind===model.filter)&&(row.name+' '+row.description+' '+row.source).toLowerCase().includes(model.query.toLowerCase().trim()));if(!entries.length){list.append(element('li','empty',model.query?'未找到匹配项':model.page==='skills'?'暂无可用技能':'暂无 MCP 配置'));return}for(const row of entries){const li=element('li','row');const glyph=element('div','row-icon');glyph.innerHTML=icon(model.page==='skills'?'skill':'mcp');const copy=element('div');const name=element('div','name-line');name.append(element('h3','item-name',row.name),element('span','source',row.source));copy.append(name,element('p','sub',row.description));if(row.meta)copy.append(element('p','item-meta',row.meta));const controls=element('div','controls');if(row.readonly)controls.append(element('span','readonly','由提供方管理'));const button=toggle(row.id,row.enabled,row.readonly,value=>{row.enabled=value;renderList();document.getElementById(row.id)?.focus();document.getElementById('status').textContent='示例：'+row.name+(value?'已开启':'已关闭')},(row.enabled?'关闭':'开启')+row.name);if(row.reason)button.title=row.reason;controls.append(button);li.append(glyph,copy,controls);list.append(li)}}
function render(){renderNav();main.replaceChildren();if(model.page==='mod'){header('PowerDSH','DSH 增强插件。优雅克制，专注实效。让你的 DSH 更顺手、更高效。');for(const page of ['skills','mcp']){const row=element('div','settings-row'),copy=element('div');copy.append(element('h3','',page==='skills'?'技能管理':'MCP 管理'),element('p','',page==='skills'?'在设置中管理技能':'在设置中管理 MCP'));row.append(copy,toggle('feature-'+page,model.features[page],false,value=>{model.features[page]=value;render();document.getElementById('feature-'+page)?.focus()},page==='skills'?'技能管理':'MCP 管理'));main.append(row)}return}header(labels[model.page],model.page==='skills'?'管理当前工作区可用的技能':'管理当前配置中的 MCP 服务器');const toolbar=element('div','toolbar'),filters=element('div','filters');filters.append(element('span','',model.page==='skills'?'工作区 · PowerDSH':'当前配置'));const select=element('select');select.setAttribute('aria-label','按来源筛选');const options=model.page==='skills'?[['all','全部来源'],['personal','个人'],['project','项目'],['plugin','插件']]:[['all','全部来源'],['profile','当前配置'],['preset','模式提供']];options.forEach(([value,label])=>{const option=element('option','',label);option.value=value;select.append(option)});select.value=model.filter;select.onchange=()=>{model.filter=select.value;renderList()};filters.append(select);const search=element('label','search');search.innerHTML=icon('search');const input=element('input');input.type='search';input.placeholder=model.page==='skills'?'搜索技能':'搜索 MCP';input.setAttribute('aria-label',input.placeholder);input.value=model.query;input.oninput=()=>{model.query=input.value;renderList()};search.append(input);toolbar.append(filters,search);const list=element('ul','list');list.id='list';main.append(toolbar,list);renderList()}
document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{model.page=button.dataset.page;model.query='';model.filter='all';render()});document.getElementById('theme').onclick=event=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';event.currentTarget.textContent=light?'切换深色':'切换浅色'};render();
</script>
</body>
</html>
